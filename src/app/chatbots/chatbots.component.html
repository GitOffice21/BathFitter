<div class="bgImage">
  <div class="Logo">
    <img class="image" src="/assets/netsmartz-llc.png" alt="Netsmartz Logo">
  </div>
  <div class="floating-btn" (click)="openCaptcha('third')" *ngIf="!verify" style="position: fixed; bottom: 20px; right: 20px; 
  background-color: darkorange; color: black; 
  padding: 10px 20px; border-radius: 25px; font-size: 16px; font-weight: bold;">
<span>Dynamicsmartz ChatBot</span>
</div>
  <div class="modal" [ngClass]="{'show': modalVisible}" role="dialog" *ngIf="modalVisible">
    <div class="modal-dialog" role="document">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">reCAPTCHA Verification</h5>
          <button type="button" class="close" (click)="closeModal()">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <div class="mb-6">
            <!-- <re-captcha siteKey="6LeRuYMqAAAAAMFAn2MgOZT-5q0c1zC0mshVWr7J" (resolved)="onCaptchaResolved($event)">
            </re-captcha> -->
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
